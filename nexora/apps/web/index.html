<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexora — plataforma SaaS de gestão empresarial modular, multiempresa e assistida por IA." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Nexora — Gestão empresarial modular</title>
    <script>
      try { const t = localStorage.getItem("nx-theme"); if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark"); } catch {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
