name: Nexora CI

on:
  push:
    paths: ["nexora/**", ".github/workflows/nexora-ci.yml"]
  pull_request:
    paths: ["nexora/**", ".github/workflows/nexora-ci.yml"]

defaults:
  run:
    working-directory: nexora

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: nexora_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nexora_test
      ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: nexora/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: nexora/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
